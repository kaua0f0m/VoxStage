[package]
name = "voxstage-native"
version = "1.0.2"
description = "VoxStage native application shell"
authors = ["VoxStage"]
edition = "2021"

[lib]
name = "voxstage_native"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "multipart", "blocking"] }
tokio = { version = "1", features = ["time"] }
rustls = "0.23"
webpki-roots = "1"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tauri = { version = "2", features = ["protocol-asset"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
ndk-context = "0.1.1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
